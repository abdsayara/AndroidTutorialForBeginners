<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كتاب الحركة الحي</title>
<style>
:root{
  --table:#7a5434;--table2:#4a2f1b;
  --paper:#f8f1e2;--paper2:#efe4cb;--card:#fffaf0;--ink:#2e2923;--muted:#6f6556;--graphite:#46423b;--line:#dccdaa;
  --dist:#c46a12;--disp:#2563a8;--vel:#1f8048;--acc:#c0362b;--time:#7a4fb0;--hl:#f2cf55;
  --carR:#b0476a;--carB:#3b4e96;--leather:#6e2a1f;--bar:rgba(28,18,10,.86);--bartx:#f6ecd9;
  --font:"Noto Sans Arabic","Segoe UI","Tahoma","Geeza Pro","Arial",sans-serif;
  --font2:"Noto Naskh Arabic","Amiri","Traditional Arabic","Times New Roman",var(--font);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --table:#24190f;--table2:#120c07;--paper:#2a2520;--paper2:#231f1a;--card:#332d26;--ink:#efe6d6;--muted:#b9ad98;--graphite:#ddd2bf;--line:#4b4237;
  --dist:#f2a253;--disp:#79aef0;--vel:#61d18f;--acc:#f47f70;--time:#c39ff0;--hl:#8c7419;--carR:#e07f9f;--carB:#8fa2ec;--leather:#3a1510;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:var(--table2);
  background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),radial-gradient(ellipse at 50% 35%,var(--table),var(--table2) 75%);}
bdi.n,bdi.u{white-space:nowrap}
.k-dist{--c:var(--dist)}.k-disp{--c:var(--disp)}.k-vel{--c:var(--vel)}.k-acc{--c:var(--acc)}.k-time{--c:var(--time)}.k-ink{--c:var(--graphite)}
b.k-dist,b.k-disp,b.k-vel,b.k-acc,b.k-time,span.k-dist,span.k-disp,span.k-vel,span.k-acc,span.k-time{color:var(--c)}
#stage{position:fixed;left:0;right:0;top:0;bottom:64px;perspective:2300px;perspective-origin:50% 30%;overflow:hidden;touch-action:pan-y}
#book{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(var(--tilt,16deg));transform-style:preserve-3d;transition:transform .5s}
.cover{position:absolute;inset:-.55em -.75em;background:var(--leather);border-radius:.45em;transform:translateZ(-15px);
  box-shadow:0 2.5em 3.5em rgba(0,0,0,.55),inset 0 0 0 .18em rgba(255,255,255,.06);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 60%)}
.edge{position:absolute;left:.15em;right:.15em;top:calc(100% - 2px);height:.55em;transform:translateZ(-7px);border-radius:0 0 .2em .2em;
  background:repeating-linear-gradient(to bottom,#e6dbc2 0 1px,#bfae8b 1px 2px);}
.spread .edge{background:linear-gradient(90deg,transparent 49.4%,rgba(0,0,0,.35) 50%,transparent 50.6%),repeating-linear-gradient(to bottom,#e6dbc2 0 1px,#bfae8b 1px 2px)}
.page{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;background-color:var(--paper);
  background-image:radial-gradient(circle at 20% 30%,rgba(140,110,60,.05),transparent 40%),radial-gradient(circle at 80% 70%,rgba(140,110,60,.06),transparent 45%);}
.page.hidden{display:none}
.slot-r{right:0;border-radius:0 .3em .3em 0}
.slot-l{left:0;border-radius:.3em 0 0 .3em}
.slot-s{left:0;width:100%;border-radius:.3em}
.slot-r::before,.slot-l::before,.slot-s::before{content:"";position:absolute;top:0;bottom:0;width:3.2em;pointer-events:none;z-index:0}
.slot-r::before{left:0;background:linear-gradient(90deg,rgba(60,40,15,.28),rgba(60,40,15,.06) 35%,transparent)}
.slot-l::before{right:0;background:linear-gradient(270deg,rgba(60,40,15,.28),rgba(60,40,15,.06) 35%,transparent)}
.slot-s::before{right:0;width:1.4em;background:linear-gradient(270deg,rgba(60,40,15,.25),transparent)}
/* ===== text page ===== */
.page.tp{transform-style:flat}
.tx{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;padding:1.2em 1.5em 1em 1.6em;line-height:1.55;font-size:.95em;scrollbar-width:thin}
.spread .tx{padding-inline-start:9.6em}
.kick{font-size:.78em;color:var(--muted);letter-spacing:.02em}
h2{font-family:var(--font2);font-size:1.55em;margin:.05em 0 .35em;line-height:1.3}
h3{font-family:var(--font2);font-size:1.18em;margin:0;line-height:1.3}
.tx p{margin:.3em 0}
.hook{display:flex;gap:.7em;align-items:center;background:var(--paper2);border:1.5px dashed var(--line);border-radius:.6em;padding:.45em .7em;margin:.2em 0 .5em}
.hook p{margin:0;font-size:.95em}
.hook svg{width:6.2em;flex:none}
.law{border:2px solid var(--graphite);border-radius:.3em .8em .4em .7em;padding:.45em .8em .5em;margin:.6em 0;background:var(--card);position:relative}
.law .lt{position:absolute;top:-.8em;right:.8em;background:var(--card);padding:0 .4em;font-size:.78em;font-weight:700;color:var(--muted)}
.eqline{font-size:1.12em;font-weight:700;color:var(--c,var(--ink));margin:.15em 0;line-height:1.9}
.eqline small{font-size:.68em;font-weight:400;color:var(--muted)}
.eq{white-space:nowrap}
.ro .eq{white-space:normal}
.vec{position:relative;display:inline-block;padding-top:.18em}
.vec::before{content:"";position:absolute;top:.12em;left:.12em;right:.05em;border-top:.085em solid currentColor}
.vec::after{content:"";position:absolute;top:-.02em;left:0;border-top:.14em solid transparent;border-bottom:.14em solid transparent;border-right:.26em solid currentColor}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 .15em;line-height:1.25}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em}
sub,sup{font-size:.68em;line-height:0}
.mnote{font-size:.8em;line-height:1.5;background:#fff6b8;color:#3b3320;padding:.6em .6em .7em;border-radius:.2em;box-shadow:.15em .25em .4em rgba(0,0,0,.18);transform:rotate(-1.6deg);margin:.7em .2em}
:root[data-theme="dark"] .mnote{background:#5a5130;color:#f6ecc8}
.mnote b{display:block;font-size:.95em;margin-bottom:.2em}
.margin{margin-top:.6em}
.spread .margin{position:absolute;right:.7em;top:5.6em;width:7.7em;display:flex;flex-direction:column;gap:1.1em}
.spread .mnote{margin:0}
.legend{font-size:.75em;display:flex;flex-wrap:wrap;gap:.2em .6em;margin-top:.4em}
.legend span::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--c);margin-inline-end:.25em;vertical-align:-.05em}
.spread .legend{flex-direction:column;padding-inline-start:.4em}
.pg{font-size:.78em;color:var(--muted);text-align:center;margin-top:.5em}
.tx .pg{margin-top:.8em}
/* predict */
.predict{border:1.5px solid var(--line);border-radius:.6em;padding:.5em .6em .6em;margin:.6em 0 .2em;background:linear-gradient(var(--paper2),var(--paper))}
.pq{font-size:.93em}
.tag{display:inline-block;background:var(--hl);color:#2a2410;font-size:.78em;font-weight:700;padding:.05em .5em;border-radius:1em;margin-inline-end:.3em}
.opts{display:flex;flex-wrap:wrap;gap:.35em;margin:.4em 0}
.opt{font:inherit;font-size:.86em;padding:.25em .65em;border:1.5px solid var(--graphite);border-radius:1em;background:var(--card);color:var(--ink);cursor:pointer;min-height:2.2em}
.opt.sel{background:var(--hl);color:#2a2410}
.opt.right{outline:.18em solid var(--vel);outline-offset:1px}
.opt.wrong{text-decoration:line-through;opacity:.7}
.flapwrap{position:relative;perspective:30em;margin-top:.3em}
.answer{font-size:.88em;padding:.5em .7em;min-height:3.4em;border:1.5px dashed var(--line);border-radius:.4em;background:var(--paper)}
.answer .fb{font-weight:700;display:block}
.flap{position:absolute;inset:0;transform-origin:50% 0;transition:transform .75s cubic-bezier(.3,1.3,.5,1),box-shadow .75s;cursor:pointer;
  border-radius:.4em;background:var(--card);border:1.5px solid var(--graphite);display:flex;align-items:center;justify-content:center;gap:.4em;
  font-size:.86em;color:var(--muted);box-shadow:0 .15em .25em rgba(0,0,0,.18);
  background-image:repeating-linear-gradient(0deg,transparent 0 1.3em,rgba(120,100,60,.12) 1.3em calc(1.3em + 1px));}
.flap::after{content:"";position:absolute;left:0;bottom:0;width:1.4em;height:1.4em;background:linear-gradient(45deg,var(--paper2) 50%,rgba(0,0,0,.18) 50%,var(--card) 60%);border-radius:0 .4em 0 .4em}
.flapwrap.open .flap{transform:rotateX(80deg);box-shadow:0 1.2em 1em -0.6em rgba(0,0,0,.35)}
/* ===== lab page ===== */
.lab{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:1em 1.4em .7em;transform-style:preserve-3d}
.lh{display:flex;align-items:baseline;gap:.6em}
.stage3d{position:relative;height:18.6em;flex:none;transform-style:preserve-3d;margin:.1em 0 .3em}
.card{position:absolute;bottom:0;transform-origin:50% 100%;transition:transform 1.15s cubic-bezier(.22,1.25,.4,1);transform-style:preserve-3d}
.card.front{left:5%;right:5%;height:14.4em;background:var(--card);border:1px solid rgba(90,70,40,.35);border-radius:.25em;
  transform:translateZ(.8px) rotateX(0deg);
  background-image:linear-gradient(rgba(255,255,255,.0),rgba(120,90,40,.05));}
.card.back{left:11%;right:11%;bottom:2em;height:16.4em;transform:translateZ(.4px) rotateX(0deg)}
.card svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.up .card.front{transform:translateZ(.8px) rotateX(calc(-1*var(--rise1,28deg)))}
.up .card.back{transform:translateZ(.4px) rotateX(calc(-1*var(--rise2,22deg)))}
.card.front::after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:.12em;background:rgba(80,60,30,.35);border-radius:0 0 .2em .2em}
.pshadow{position:absolute;left:4%;right:4%;bottom:0;height:12em;opacity:0;transition:opacity 1.1s;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(50,30,10,.42),rgba(50,30,10,.12) 45%,transparent 70%);transform:translateZ(.1px)}
.pshadow.s2{bottom:2em;left:10%;right:10%;height:13em;background:radial-gradient(ellipse at 50% 100%,rgba(50,30,10,.3),transparent 65%)}
.up .pshadow{opacity:1}
.cshadow{position:absolute;left:4%;right:4%;bottom:-1.3em;height:1.3em;background:linear-gradient(rgba(60,40,15,.28),transparent);opacity:0;transition:opacity 1.1s;filter:blur(1px);border-radius:0 0 50% 50%}
.up .cshadow{opacity:1}
.sshadow{position:absolute;left:0;right:30%;bottom:.1em;height:13em;opacity:0;transition:opacity 1.1s;background:linear-gradient(100deg,rgba(60,40,15,.22),transparent 45%);transform:translateZ(.05px)}
.up .sshadow{opacity:1}
.strut{position:absolute;bottom:0;width:2.6em;height:9em;background:var(--paper2);border:1px solid rgba(90,70,40,.35);transition:transform 1.15s cubic-bezier(.22,1.25,.4,1);transform:translateZ(.2px)}
.strut.sl{right:95%;transform-origin:100% 100%;clip-path:polygon(0 100%,100% 100%,100% 0)}
.strut.sr{left:95%;transform-origin:0 100%;clip-path:polygon(0 0,0 100%,100% 100%)}
.up .strut.sl{transform:translateZ(.2px) rotateX(calc(-1*var(--rise1,28deg))) rotateY(-62deg)}
.up .strut.sr{transform:translateZ(.2px) rotateX(calc(-1*var(--rise1,28deg))) rotateY(62deg)}
.teacher.wide .strut{height:60%}
.crease{position:absolute;left:3%;right:3%;bottom:-.05em;height:.12em;border-radius:1em;background:linear-gradient(90deg,transparent,rgba(70,50,25,.45) 10%,rgba(70,50,25,.45) 90%,transparent)}
.crease.c2{bottom:1.95em;left:9%;right:9%;opacity:.6}
.ctls{display:flex;flex-direction:column;gap:.35em;min-height:0}
.row{display:flex;flex-wrap:wrap;gap:.3em;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5em,1fr));gap:.15em .9em}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;font-size:.86em;color:var(--ink)}
.ctl .nm{color:var(--c)}
.ctl output{font-weight:700;color:var(--c)}
.ctl input{grid-column:1/-1;width:100%;margin:.1em 0 0;accent-color:var(--c);height:1.7em;cursor:pointer}
.btn{font:inherit;font-size:.82em;padding:.3em .75em;min-height:2.3em;border:1.5px solid var(--graphite);border-radius:.45em .7em .4em .65em;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:.08em .14em 0 rgba(0,0,0,.18)}
.btn:active{box-shadow:inset 0 .12em .2em rgba(0,0,0,.25);filter:brightness(.95)}
.btn.on{background:var(--hl);color:#2a2410}
.btn.go{border-color:var(--vel);color:var(--vel);font-weight:700}
.btn:focus-visible,.opt:focus-visible,.flap:focus-visible,.tb:focus-visible{outline:.15em solid var(--disp);outline-offset:.1em}
.ro{font-size:.84em;line-height:1.75;border-inline-start:.22em solid var(--line);padding:.15em .6em;background:repeating-linear-gradient(0deg,transparent 0 1.74em,rgba(120,100,60,.13) 1.74em calc(1.74em + 1px))}
.ro>div{color:var(--c,var(--ink))}
.ro .ok{color:var(--vel);font-weight:700}
.lab .pg{margin-top:auto}
.lab[data-mode="line"] .only-circle,.lab[data-mode="circle"] .only-line,.lab[data-mode="fall"] .only-up,.lab[data-mode="up"] .only-fall{display:none}
.sep{width:1px;height:1.6em;background:var(--line);margin:0 .2em}
.stars{color:#d9a400;letter-spacing:.05em;font-size:1.1em}
.stars .off{color:var(--line)}
.gq{font-size:.9em;background:var(--paper2);border-radius:.4em;padding:.35em .6em}
.fbk{font-size:.85em;min-height:2.6em}
table.score{width:100%;border-collapse:collapse;font-size:.9em;margin:.4em 0}
table.score td,table.score th{border-bottom:1px solid var(--line);padding:.25em .3em;text-align:start}
/* SVG pencil */
svg.m{direction:ltr}
.m .pen{fill:none;stroke:var(--graphite);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.m .thin{stroke-width:1}
.m .ghost{opacity:.33;stroke-width:.9}
.m .dash{stroke-dasharray:5 5}
.m .t{fill:var(--ink);font-size:12px;font-family:var(--font)}
.m .sm{font-size:10px;fill:var(--muted)}
.m .b{font-weight:700}
.m .tc-dist{fill:var(--dist)}.m .tc-disp{fill:var(--disp)}.m .tc-vel{fill:var(--vel)}.m .tc-acc{fill:var(--acc)}.m .tc-time{fill:var(--time)}
.arr path{stroke:var(--a);fill:none;stroke-linecap:round}
.arr .hd{fill:var(--a);stroke:var(--a);stroke-width:1;stroke-linejoin:round}
.scn .sil{fill:var(--card);stroke:var(--graphite);stroke-width:1.4}
.scn .pen{fill:none;stroke:var(--graphite);stroke-width:1.2;stroke-linecap:round;opacity:.75}
/* teacher mode */
.teacher .lab{padding:1em 1.6em .6em}
.teacher.wide .lab{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr auto;column-gap:1.4em}
.teacher.wide .lh{grid-column:1/-1}
.teacher.wide .stage3d{height:auto;min-height:20em;align-self:stretch;grid-row:2}
.teacher.wide .ctls{grid-row:2;align-self:center}
.teacher.wide .lab .pg{grid-column:1/-1}
.teacher.wide .card.front{height:calc(100% - 3.4em)}
.teacher.wide .card.back{height:calc(100% - 1.6em)}
.teacher.wide .pshadow{height:80%}
.teacher:not(.wide) .stage3d{height:22em}
.teacher:not(.wide) .stage3d{height:22em}
.teacher:not(.wide) .card.front{height:17em}
.teacher:not(.wide) .card.back{height:19.4em}
/* leaf */
.leaf{position:absolute;top:0;transform-style:preserve-3d;transform:translateZ(3px);pointer-events:none;z-index:50}
.strip{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.bk{transform:rotateY(180deg)}
.face>.page{position:absolute;top:0;display:block}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.12) 50%,rgba(0,0,0,.18));opacity:var(--sh,0);pointer-events:none}
/* bar */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.4rem .7rem;padding-bottom:calc(.4rem + env(safe-area-inset-bottom));background:var(--bar);color:var(--bartx);z-index:100;font-family:var(--font)}
#bar .mid{display:flex;align-items:center;gap:.35rem;flex-wrap:nowrap;min-width:0}
.tb{font:inherit;font-size:.92rem;min-width:44px;min-height:44px;padding:0 .7rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;white-space:nowrap}
.tb:disabled{opacity:.35;cursor:default}
.tb.on{background:#f2cf55;color:#2a2410}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.wa{text-decoration:none;border-color:rgba(37,211,102,.6)}
.tb.wa .wai{width:22px;height:22px}
@media (max-width:420px){#bar{padding-left:.35rem;padding-right:.35rem;gap:.2rem}#bar .mid{gap:.2rem}.tb{padding:0 .45rem}#ind{display:none}}
#ind{font-size:.85rem;opacity:.9;white-space:nowrap;padding:0 .2rem}
@media (max-width:560px){.tb .lbl{display:none}#ind{font-size:.75rem}}
@media (prefers-reduced-motion:reduce){.card,.flap,.pshadow{transition-duration:.01s!important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<svg class="vh" aria-hidden="true" style="position:absolute;width:0;height:0">
  <defs>
    <filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="h-g" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--graphite);stroke-width:.8;opacity:.55"/></pattern>
    <pattern id="h-r" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--carR);stroke-width:1.3"/></pattern>
    <pattern id="h-b" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--carB);stroke-width:1.3"/></pattern>
    <pattern id="h-y" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--disp);stroke-width:1;opacity:.55"/></pattern>
    <pattern id="h-ball" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="3.5" style="stroke:var(--graphite);stroke-width:.9;opacity:.6"/></pattern>
  </defs>
</svg>

<div id="stage" aria-live="polite">
  <div id="book" class="spread">
    <div class="cover"></div>
    <div class="edge"></div>
  </div>
</div>

<nav id="bar" aria-label="التنقل">
  <button class="tb" id="prev" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span class="lbl">السابق</span></button>
  <div class="mid">
    <span id="ind"></span>
    <button class="tb" id="teach" aria-pressed="false" title="وضع المعلم"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg><span class="lbl">وضع المعلم</span></button>
    <button class="tb" id="mute" aria-pressed="false" title="كتم الصوت"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="mwave" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const AD='٠١٢٣٤٥٦٧٨٩';
function ar(x,d){ if(d===undefined)d=2; if(!isFinite(x)) return '—'; let v=+(+x).toFixed(d); if(Math.abs(v)<Math.pow(10,-d)/2||Object.is(v,-0)) v=0;
  let s=v.toFixed(d); if(d>0) s=s.replace(/\.?0+$/,''); return s.replace('-','−').replace('.','٫').replace(/\d/g,c=>AD[c]); }
const n=(x,d)=>`<bdi dir="ltr" class="n">${ar(x,d)}</bdi>`;
const np=(x,d)=>x<0?`(${n(x,d)})`:n(x,d);
const u=s=>`<bdi dir="ltr" class="u">${s}</bdi>`;
const M='م',KM='كم',SEC='ث',MIN='دقيقة',MS='م/ث',MS2='م/ث<sup>٢</sup>',KG='كغم';
const nu=(x,d,s)=>n(x,d)+'&nbsp;'+u(s);
const V=(l,s)=>`<span class="vec">${l}${s?`<sub>${s}</sub>`:''}</span>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const EQ=s=>`<bdi dir="rtl" class="eq">${s}</bdi>`;
const HALF=fr(n(1),n(2));
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const R1=v=>Math.round(v*10)/10;
function hsh(a,b){const x=Math.sin(a*12.9898+b*78.233)*43758.5453;return x-Math.floor(x);}
function pl(pts,cls,extra){cls=cls||'pen';extra=extra||'';
  const d='M'+pts.map(p=>R1(p[0])+' '+R1(p[1])).join(' L');
  const j=(hsh(pts[0][0],pts[0][1])-.5)*1.6;
  const d2='M'+pts.map(p=>R1(p[0]+j)+' '+R1(p[1]-j*.7)).join(' L');
  return `<path d="${d}" class="${cls}" ${extra}/><path d="${d2}" class="${cls} ghost" ${extra}/>`;}
function circ(cx,cy,r,cls,fill){cls=cls||'pen';const j=(hsh(cx,cy)-.5)*1.4;
  return `<circle cx="${R1(cx)}" cy="${R1(cy)}" r="${R1(r)}" class="${cls}" ${fill?`style="fill:${fill}"`:''}/><circle cx="${R1(cx+j)}" cy="${R1(cy-j)}" r="${R1(r)}" class="${cls} ghost"/>`;}
function arrow(x1,y1,x2,y2,c,w){w=w||2.2;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<2)return '';
  const ux=dx/L,uy=dy/L,hs=Math.min(7+w,L*.7),bx=x2-ux*hs,by=y2-uy*hs,px=-uy*hs*.45,py=ux*hs*.45;
  return `<g class="arr" style="--a:var(--${c})"><path d="M${R1(x1)} ${R1(y1)} L${R1(bx)} ${R1(by)}" stroke-width="${w}"/><path class="hd" d="M${R1(x2)} ${R1(y2)} L${R1(bx+px)} ${R1(by+py)} L${R1(bx-px)} ${R1(by-py)} Z"/></g>`;}
function txt(x,y,s,cls,anc){return `<text x="${R1(x)}" y="${R1(y)}" class="t ${cls||''}" text-anchor="${anc||'middle'}">${s}</text>`;}
function niceStep(range,maxT){const raw=range/maxT;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10]) if(m*p>=raw) return m*p;return 10*p;}
function tween(D,fn,done){let t0=null,id;function f(ts){if(t0===null)t0=ts;const t=Math.min(1,(ts-t0)/D);fn(t);if(t<1)id=requestAnimationFrame(f);else if(done)done();}id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id);}
function mk(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function sl(k,label,cls,min,max,step,val){return `<label class="ctl ${cls}"><span class="nm">${label}</span><output data-o="${k}"></output><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;}
function rng(root,k,fmt,cb){const i=$(`input[data-k="${k}"]`,root),o=$(`[data-o="${k}"]`,root);
  const show=()=>{if(o)o.innerHTML=fmt(parseFloat(i.value));};
  i.addEventListener('input',()=>{show();cb(parseFloat(i.value));});show();
  return{el:i,set(v){i.value=v;show();},get v(){return parseFloat(i.value);}};}
function scene(kind){ // die-cut back layer
  let top='M0 70 Q40 30 90 55 T190 45 T290 60 T400 38 L400 300 L0 300 Z', deco='';
  if(kind==='city'){top='M0 300 L0 70 L30 70 L30 45 L60 45 L60 62 L95 62 L95 30 L120 30 L120 58 L160 58 L160 40 L200 40 L200 66 L235 66 L235 25 L262 25 L262 55 L300 55 L300 42 L340 42 L340 64 L370 64 L370 36 L400 36 L400 300 Z';
    deco=pl([[105,40],[110,40]],'pen')+pl([[245,35],[252,35]],'pen');}
  if(kind==='stands'){top='M0 300 L0 60 L400 60 L400 300 Z';for(let i=0;i<14;i++){deco+=circ(20+i*27,48+(i%2)*4,6,'pen');}
    deco+=pl([[0,60],[400,60]],'pen');}
  if(kind==='sky'){top='M0 300 L0 90 Q60 60 120 80 Q200 50 280 78 Q340 58 400 72 L400 300 Z';deco=circ(340,30,14,'pen')+pl([[40,40],[70,40]],'pen')+pl([[50,32],[85,32]],'pen');}
  if(kind==='stars'){top='M0 300 L0 75 L400 75 L400 300 Z';for(let i=0;i<7;i++){const x=30+i*57,y=30+(i%3)*12;deco+=`<path class="pen" d="M${x} ${y-8} L${x+2.5} ${y-2} L${x+8} ${y-2} L${x+3.5} ${y+2} L${x+5} ${y+8} L${x} ${y+4} L${x-5} ${y+8} L${x-3.5} ${y+2} L${x-8} ${y-2} L${x-2.5} ${y-2} Z"/>`;}}
  if(kind==='hills'){deco=circ(60,28,12,'pen')+pl([[300,25],[330,25]],'pen')+pl([[310,18],[345,18]],'pen');}
  return `<svg class="scn" viewBox="0 0 400 300" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><g filter="url(#pencil)">${deco}<path class="sil" d="${top}"/></g></svg>`;}
function popup(kind,vb,label){return `<div class="stage3d"><div class="pshadow s2"></div><div class="pshadow"></div>
  <div class="card back">${scene(kind)}</div>
  <div class="card front"><svg class="m" viewBox="${vb}" role="img" aria-label="${label}"><g filter="url(#pencil)" class="dyn"></g><g class="lbl"></g></svg></div>
  <div class="strut sl"></div><div class="strut sr"></div><div class="sshadow"></div><div class="cshadow"></div><div class="crease c2"></div><div class="crease"></div></div>`;}
function predict(q,opts,correct,ans){return `<div class="predict" data-c="${correct}"><div class="pq"><span class="tag">توقّع ثم اكشف</span>${q}</div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
  <div class="flapwrap"><div class="answer"><span class="fb"></span>${ans}</div><div class="flap" role="button" tabindex="0" aria-expanded="false"><span>ارفع اللسان الورقي لتكشف الإجابة</span></div></div></div>`;}
const legend=`<div class="legend"><span class="k-dist">المسافة</span><span class="k-disp">الإزاحة/الموضع</span><span class="k-vel">السرعة</span><span class="k-acc">التسارع</span><span class="k-time">الزمن</span></div>`;
function labHead(i,t){return `<div class="lh"><span class="kick">مختبر ${n(i)}</span><h3>${t}</h3></div>`;}
function setSVG(root,G,T){$('.dyn',root).innerHTML=G;$('.lbl',root).innerHTML=T;}

/* ---------- audio ---------- */
let actx=null,muted=false;
try{muted=localStorage.getItem('lb-muted')==='1';}catch(e){}
function ac(){if(muted)return null;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function flipSound(){const a=ac();if(!a)return;try{const d=.42,sr=a.sampleRate,b=a.createBuffer(1,Math.floor(sr*d),sr),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++){const k=i/ch.length;ch[i]=(Math.random()*2-1)*Math.pow(1-k,1.6)*(.55+.45*Math.sin(k*30));}
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';const t=a.currentTime;f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(3200,t+d);f.Q.value=.8;
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start();}catch(e){}}
function chime(k){const a=ac();if(!a)return;try{const t=a.currentTime;for(let i=0;i<k;i++){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=660*Math.pow(1.26,i);
  g.gain.setValueAtTime(.0001,t+i*.13);g.gain.exponentialRampToValueAtTime(.12,t+i*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.35);o.connect(g).connect(a.destination);o.start(t+i*.13);o.stop(t+i*.13+.4);}}catch(e){}}

/* =====================================================================
   CHAPTER 1 : position, distance, displacement
   ===================================================================== */
const mapSVG=`<svg viewBox="0 0 120 120" class="m" aria-label="رسم: الطريق من نابلس إلى القدس"><g filter="url(#pencil)">
 ${pl([[70,14],[52,30],[78,48],[48,66],[72,84],[58,104]],'pen','style="stroke:var(--dist);stroke-width:2.6"')}
 ${arrow(70,14,58,102,'disp',2)}${circ(70,14,4,'pen')}${circ(58,104,4,'pen')}</g>
 ${txt(96,18,'نابلس','t sm')}${txt(92,112,'القدس','t sm')}</svg>`;
function t1(){return `<div class="tx">
 <div class="kick">الفصل ${n(1)} · وصف الحركة · ص ${n(25)}–${n(27)}</div>
 <h2>الموضع والمسافة والإزاحة</h2>
 <div class="hook">${mapSVG}<p><b>لغز البداية:</b> قطعت سيارة ${nu(76,0,KM)} على الطريق من نابلس جنوباً إلى القدس. هل يكفي الرقم ${nu(76,0,KM)} لنعرف أين صارت السيارة؟</p></div>
 <p><b>الموضع:</b> المتجه الواصل بين نقطة البداية (نقطة الإسناد) وموضع الجسم.</p>
 <p><b class="k-dist">المسافة</b>: طول المسار الحقيقي الذي يسلكه الجسم خلال حركته.</p>
 <p><b class="k-disp">الإزاحة</b>: التغيّر في موضع الجسم، ويُعبَّر عنها بالمتجه الواصل بين نقطة البداية ونقطة النهاية.</p>
 <div class="law"><span class="lt">القانون</span>
  <div class="eqline k-dist">${EQ(`ف = ف<sub>١</sub> + ف<sub>٢</sub>`)} <small>المسافة: المجموع الجبري للمسافات</small></div>
  <div class="eqline k-disp">${EQ(`${V('ح')} = ${V('ف','١')} + ${V('ف','٢')}`)} <small>الإزاحة: حاصل جمع الاتجاهات</small></div>
  <div class="eqline k-dist">${EQ(`ف = ٢ π نق`)} <small>المسافة في دورة كاملة (محيط الدائرة)</small></div>
 </div>
 ${predict(`يتحرك طفل في عربته ${nu(10,0,M)} شرقاً ثم يرجع ${nu(7,0,M)} غرباً. كم إزاحته؟`,
   [nu(17,0,M), nu(3,0,M)+' شرقاً', nu(3,0,M)+' غرباً'],1,
   `المسافة = ${n(10)} + ${n(7)} = ${nu(17,0,M)}، أما الإزاحة فتعتمد على البداية والنهاية فقط: ${n(10)} − ${n(7)} = ${nu(3,0,M)} شرقاً. جرّبها في المختبر المقابل.`)}
 <aside class="margin"><div class="mnote"><b>ملاحظة في الهامش</b>المسافة كمية قياسية، أما الإزاحة فكمية متجهة لها مقدار واتجاه. وتُقاسان كلتاهما بالمتر (${u(M)}).</div>
 <div class="mnote n2"><b>تذكّر</b>في دوار نابلس: المسافة ${nu(31.4,1,M)} لكن الإزاحة صفر، لأن البداية هي النهاية.</div>
 ${legend}</aside>
 <div class="pg">${n(1)}</div></div>`;}
function l1(){return `<div class="lab" data-mode="line">${labHead(1,'عربة الطفل ودوّار نابلس')}
 ${popup('hills','0 0 400 220','نموذج الحركة: المسافة والإزاحة')}
 <div class="ctls">
  <div class="row"><button class="btn on" data-m="line">خط مستقيم · مثال ${n(1)}</button><button class="btn" data-m="circle">دوّار نابلس · مثال ${n(2)}</button></div>
  <div class="grid only-line">${sl('f1','ف<sub>١</sub> شرقاً','k-dist',0,20,1,10)}${sl('f2','ف<sub>٢</sub> غرباً','k-dist',0,20,1,7)}</div>
  <div class="grid only-circle">${sl('r','نصف قطر الدوّار نق','k-disp',1,10,.5,5)}</div>
  <div class="row only-line"><button class="btn go" data-a="go">حرّك العربة</button></div>
  <div class="row only-circle"><button class="btn" data-f=".25">ربع دورة</button><button class="btn" data-f=".5">نصف دورة</button><button class="btn" data-f=".75">ثلاثة أرباع</button><button class="btn go" data-f="1">دورة كاملة</button></div>
  <div class="ro" aria-live="polite"></div>
 </div><div class="pg">${n(2)}</div></div>`;}
function i1(root){
  const lab=$('.lab',root);const S={mode:'line',f1:10,f2:7,p:1,r:5,frac:1,cur:1};let stop=null;
  rng(root,'f1',v=>nu(v,0,M),v=>{S.f1=v;S.p=1;draw();});
  rng(root,'f2',v=>nu(v,0,M),v=>{S.f2=v;S.p=1;draw();});
  rng(root,'r',v=>nu(v,1,M),v=>{S.r=v;draw();});
  $$('[data-m]',root).forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;lab.dataset.mode=S.mode;$$('[data-m]',root).forEach(x=>x.classList.toggle('on',x===b));if(stop)stop();draw();});
  $('[data-a="go"]',root).onclick=()=>{if(stop)stop();stop=tween(2600,t=>{S.p=t;draw();});};
  $$('[data-f]',root).forEach(b=>b.onclick=()=>{if(stop)stop();S.frac=parseFloat(b.dataset.f);$$('[data-f]',root).forEach(x=>x.classList.toggle('on',x===b));
    stop=tween(900+2200*S.frac,t=>{S.cur=S.frac*t;draw();});});
  function stroller(x,gy){return pl([[x-15,gy-12],[x+13,gy-12],[x+10,gy-26]],'pen')+`<path class="pen" d="M${x-15} ${gy-12} Q${x-18} ${gy-30} ${x+10} ${gy-26}" style="fill:url(#h-g)"/>`+
    pl([[x-15,gy-18],[x-24,gy-36],[x-29,gy-36]],'pen')+circ(x+1,gy-33,5,'pen')+circ(x-9,gy-5,5,'pen')+circ(x+9,gy-5,5,'pen');}
  function draw(){let G='',T='',ro='';
    if(S.mode==='line'){const sc=8.5,x0=200,gy=150,tot=S.f1+S.f2,s=S.p*tot,s1=Math.min(s,S.f1),s2=Math.max(0,s-S.f1),pos=s1-s2,X=x0+pos*sc;
      G+=pl([[18,gy],[382,gy]],'pen');for(let m=-20;m<=20;m+=5){const x=x0+m*sc;G+=pl([[x,gy-4],[x,gy+4]],'pen thin');}
      G+=arrow(318,20,382,20,'graphite',1.5);T+=txt(350,13,'شرق','t sm');T+=txt(x0,gy+17,'البداية','t sm');
      if(s1>.05){G+=arrow(x0,72,x0+s1*sc,72,'dist',2.6);T+=txt(clamp(x0+s1*sc/2,40,360),64,'ف١ = '+ar(s1,1)+' م','t tc-dist b');}
      if(s2>.05){G+=arrow(x0+S.f1*sc,98,X,98,'dist',2.6);T+=txt(clamp(x0+(S.f1-s2/2)*sc,40,360),114,'ف٢ = '+ar(s2,1)+' م','t tc-dist b');}
      if(Math.abs(pos)>.05){G+=arrow(x0,184,X,184,'disp',3.2);T+=txt(clamp((x0+X)/2,50,350),206,'الإزاحة = '+ar(Math.abs(pos),1)+' م '+(pos>0?'شرقاً':'غرباً'),'t tc-disp b');}
      else if(s>0.05) T+=txt(x0,206,'الإزاحة = صفر','t tc-disp b');
      G+=circ(x0,gy,2.5,'pen')+stroller(X,gy);
      const dir=pos>0.0001?'شرقاً':pos<-0.0001?'غرباً':'';
      ro=`<div class="k-dist">المسافة: ${EQ(`ف = ${n(s1,1)} + ${n(s2,1)} = ${nu(s,1,M)}`)}</div>
          <div class="k-disp">الإزاحة: ${EQ(`|${V('ح')}| = |${V('ف','١')}| − |${V('ف','٢')}| = ${n(s1,1)} − ${n(s2,1)}`)} ⟸ ${nu(Math.abs(pos),1,M)} ${dir}</div>
          <div class="k-ink">${S.p<1?'العربة تتحرك…':(Math.abs(pos)<1e-9&&s>0?'عادت العربة إلى نقطة البداية: الإزاحة صفر مع أن المسافة ليست صفراً.':(s>Math.abs(pos)?'لاحظ: المسافة أكبر من مقدار الإزاحة لأن العربة غيّرت اتجاهها.':'تحركت العربة في اتجاه واحد: المسافة = مقدار الإزاحة.'))}</div>`;
    } else {const cx=200,cy=108,Rp=S.r*9,phi0=Math.PI/2,ang=phi0-2*Math.PI*S.cur;
      G+=circ(cx,cy,Rp+9,'pen');if(Rp>12)G+=circ(cx,cy,Rp-9,'pen thin');G+=circ(cx,cy,Math.max(3,Rp*.32),'pen','url(#h-g)');
      const pts=[];const N=Math.max(2,Math.ceil(80*S.cur));for(let i=0;i<=N;i++){const a=phi0-2*Math.PI*S.cur*i/N;pts.push([cx+Rp*Math.cos(a),cy+Rp*Math.sin(a)]);}
      if(S.cur>0.002)G+=pl(pts,'pen','style="stroke:var(--dist);stroke-width:3.2"');
      const sx=cx,sy=cy+Rp,ex=cx+Rp*Math.cos(ang),ey=cy+Rp*Math.sin(ang);
      G+=pl([[cx,cy],[sx,sy]],'pen thin dash');T+=txt(cx+8,cy+Rp/2+4,'نق','t sm','start');
      G+=arrow(sx,sy,ex,ey,'disp',3);
      const deg=(ang*180/Math.PI)-90;G+=`<g transform="translate(${R1(ex)} ${R1(ey)}) rotate(${R1(deg)})"><rect x="-8" y="-5" width="16" height="10" rx="3" class="pen" style="fill:url(#h-b)"/></g>`;
      T+=txt(sx,sy+22,'البداية','t sm');
      const dist=S.cur*2*3.14*S.r,disp=2*S.r*Math.sin(Math.PI*S.cur);
      let exact='';const done=Math.abs(S.cur-S.frac)<1e-9;

    fb.textContent=sel===null?'الإجابة:':(sel===c?'✔ توقّعك صحيح!':'✘ ليس تماماً، انظر لماذا:');fb.style.color=sel===null?'':(sel===c?'var(--vel)':'var(--acc)');}
  const tog=()=>{const o=wrap.classList.toggle('open');flap.setAttribute('aria-expanded',o);if(o)judge();else opts.forEach(x=>x.classList.remove('right','wrong'));};
  flap.onclick=tog;flap.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}};});

/* ---------- layout & navigation ---------- */
let mode='spread',cur=0,busy=false,teacher=false,pw=0,ph=0;
function layout(){const bar=$('#bar');stage.style.bottom=bar.offsetHeight+'px';const W=stage.clientWidth,H=stage.clientHeight;
  let m=teacher?'teacher':((W>=860&&W/H>=1.12)?'spread':'single');let fs,tilt,bw;
  if(m==='spread'){ph=Math.min(H*.86,(W*.9/2)/.78);pw=ph*.78;fs=ph/44;bw=pw*2;tilt=16;}
  else if(m==='single'){pw=Math.min(W-18,720);let ph0=Math.min(H-22,pw/.56);fs=Math.min(ph0/44,21);ph=fs*44;pw=Math.min(pw,ph*.86);bw=pw;tilt=6;}
  else{pw=W*.96;ph=H*.93;fs=Math.min(ph/34,pw/28,30);bw=pw;tilt=7;}
  if(m!==mode){mode=m;normalize();}
  book.className=m+(m==='teacher'?' teacher'+(pw/ph>1.15?' wide':''):'');
  book.style.width=bw+'px';book.style.height=ph+'px';book.style.fontSize=fs+'px';book.style.setProperty('--tilt',tilt+'deg');
  book.style.setProperty('--rise1',(tilt+12)+'deg');book.style.setProperty('--rise2',(tilt+6)+'deg');
  show();}
function normalize(){if(mode==='spread')cur-=cur%2;else if(mode==='teacher'&&cur%2===0)cur+=1;}
function slotOf(){return mode==='spread'?[[cur,'slot-r'],[cur+1,'slot-l']]:[[cur,'slot-s']];}
function place(p,slot){p.classList.remove('hidden','slot-r','slot-l','slot-s');p.classList.add(slot);}
function hide(p){p.classList.add('hidden');p.classList.remove('slot-r','slot-l','slot-s');}
function show(){P.forEach(p=>{if(!p.classList.contains('hidden'))return;});P.forEach(hide);slotOf().forEach(([i,s])=>{place(P[i],s);rise(P[i]);});ind();}
function rise(p,delay){const l=$('.lab',p);if(!l)return;if(l.classList.contains('up')&&!delay)return;l.classList.remove('up');void l.offsetWidth;setTimeout(()=>l.classList.add('up'),delay||120);}
function fold(p){const l=$('.lab',p);if(l)l.classList.remove('up');}
function ind(){const ch=Math.floor(cur/2)+1;$('#ind').textContent=`الفصل ${ar(ch,0)} من ${ar(5,0)}`+(mode==='single'?(cur%2?' · المختبر':' · الشرح'):'');
  const st=mode==='single'?1:2;$('#prev').disabled=cur-st<0&&!(mode==='single'&&cur>0);$('#next').disabled=(mode==='spread'?cur+2>8:mode==='teacher'?cur+2>9:cur+1>9);
  $('#teach').classList.toggle('on',teacher);$('#teach').setAttribute('aria-pressed',teacher);$('#teach .lbl').textContent=teacher?'عودة للكتاب':'وضع المعلم';}
function snap(p,w,h){const c=p.cloneNode(true);c.classList.remove('hidden','slot-r','slot-l','slot-s');c.style.width=w+'px';c.style.height=h+'px';c.style.left='0';
  const l=$('.lab',c);if(l)l.classList.remove('up');const a=$$('input',p),b=$$('input',c);b.forEach((x,i)=>x.value=a[i].value);c.removeAttribute('id');return c;}
function buildLeaf(fp,bp,type,left,w,h){const N=6,s=w/N;const leaf=mk('div','leaf');leaf.style.cssText=`left:${left}px;width:${w}px;height:${h}px`;
  let par=leaf;const strips=[];
  for(let k=0;k<N;k++){const st=mk('div','strip');st.style.width=s+'px';
    if(type==='R'){st.style.right=k===0?'0':'100%';st.style.transformOrigin='100% 50%';}else{st.style.left=k===0?'0':'100%';st.style.transformOrigin='0 50%';}
    const fo=type==='R'?-(N-1-k)*s:-k*s,bo=type==='R'?-k*s:-(N-1-k)*s;
    const f=mk('div','face'),b=mk('div','face bk');
    if(fp){const c=snap(fp,w,h);c.style.left=fo+'px';f.appendChild(c);}
    if(bp){const c=snap(bp,w,h);c.style.left=bo+'px';b.appendChild(c);}
    st.appendChild(f);st.appendChild(b);par.appendChild(st);par=st;strips.push(st);}
  book.appendChild(leaf);
  // keep text page scroll
  [[fp,0],[bp,1]].forEach(([pg,j])=>{if(!pg)return;const tx=$('.tx',pg);if(!tx)return;strips.forEach(st=>{const c=$(j?'.face.bk .tx':'.face:not(.bk) .tx',st);if(c)c.scrollTop=tx.scrollTop;});});
  return{leaf,strips};}
function animLeaf(L,from,to,onMid){return new Promise(res=>{const red=matchMedia('(prefers-reduced-motion: reduce)').matches;let mid=false;
  tween(red?200:820,t=>{const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const base=from+(to-from)*e;const curl=-Math.sign(to-from)*Math.sin(Math.PI*t)*9;
    L.strips[0].style.transform=`rotateY(${base}deg)`;for(let k=1;k<L.strips.length;k++)L.strips[k].style.transform=`rotateY(${curl}deg)`;
    L.leaf.style.setProperty('--sh',(Math.sin(Math.PI*e)*.55).toFixed(3));if(!mid&&t>.45){mid=true;onMid&&onMid();}},res);});}
async function go(dir){if(busy)return;const step=mode==='single'?1:2;const tgt=cur+dir*step;
  if(tgt<0||tgt>(mode==='spread'?8:9)||(mode==='teacher'&&tgt<1))return;busy=true;flipSound();
  const W=book.clientWidth,H=book.clientHeight;
  try{
  if(mode==='spread'){const half=W/2;
    if(dir>0){const front=P[cur+1],back=P[cur+2],under=P[cur+3];const L=buildLeaf(front,back,'R',0,half,H);hide(front);place(under,'slot-l');fold(under);
      await animLeaf(L,0,180,()=>rise(under,1));place(back,'slot-r');hide(P[cur]);L.leaf.remove();}
    else{const front=P[cur],back=P[cur-1],under=P[cur-2];const L=buildLeaf(front,back,'L',half,half,H);hide(front);place(under,'slot-r');
      await animLeaf(L,0,-180);place(back,'slot-l');fold(back);rise(back,1);hide(P[cur+1]);L.leaf.remove();}
  }else{
    if(dir>0){const front=P[cur],under=P[tgt];const L=buildLeaf(front,null,'R',0,W,H);hide(front);place(under,'slot-s');fold(under);
      await animLeaf(L,0,180,()=>rise(under,1));L.leaf.remove();}
    else{const land=P[tgt];const L=buildLeaf(land,null,'R',0,W,H);L.strips[0].style.transform='rotateY(180deg)';
      await animLeaf(L,180,0);hide(P[cur]);place(land,'slot-s');fold(land);rise(land,1);L.leaf.remove();}
  }}finally{cur=tgt;busy=false;ind();}}
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{const a=document.activeElement;if(a&&(a.type==='range'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();go(1);}else if(e.key==='ArrowRight'){e.preventDefault();go(-1);}});
// swipe
let sw=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('input,button,.flap,label,.opt,a'))return;sw={x:e.clientX,y:e.clientY,id:e.pointerId};});
stage.addEventListener('pointerup',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx>0?1:-1);});
stage.addEventListener('pointercancel',()=>{sw=null;});
// toolbar
$('#teach').onclick=()=>{if(busy)return;teacher=!teacher;if(teacher){if(cur%2===0)cur+=1;}else{mode='';}layout();};
function muteUI(){$('#mute').classList.toggle('on',muted);$('#mute').setAttribute('aria-pressed',muted);$('#mwave').style.display=muted?'none':'';$('#mute').title=muted?'تشغيل الصوت':'كتم الصوت';}
$('#mute').onclick=()=>{muted=!muted;try{localStorage.setItem('lb-muted',muted?'1':'0');}catch(e){}muteUI();if(!muted)flipSound();};
function isDark(){return document.documentElement.dataset.theme==='dark';}
$('#theme').onclick=()=>{const d=!isDark();document.documentElement.dataset.theme=d?'dark':'light';try{localStorage.setItem('lb-theme',d?'dark':'light');}catch(e){}};
try{const t=localStorage.getItem('lb-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
muteUI();
let rz=0;window.addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(layout);});
layout();
window.__book={go,P,get cur(){return cur},get mode(){return mode}};
})();
</script>
