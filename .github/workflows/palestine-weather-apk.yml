name: Palestine Weather APK

on:
  push:
    paths:
      - "PalestineWeather/**"
      - ".github/workflows/palestine-weather-apk.yml"
  workflow_dispatch:

# The build only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PalestineWeather
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      # For testing on a phone: installed straight from the file.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: palestine-weather-debug-apk
          path: PalestineWeather/app/build/outputs/apk/debug/app-debug.apk

      # For Google Play: the release bundle, signed with the upload key kept in the
      # repository's secrets (Settings → Secrets and variables → Actions). Without them
      # the bundle is still built, unsigned, and cannot be uploaded to the store.
      - name: Restore the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key in the repository secrets: the release bundle is unsigned."
          fi

      - name: Build release bundle (AAB)
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: palestine-weather-release-aab
          path: |
            PalestineWeather/app/build/outputs/bundle/release/*.aab
            PalestineWeather/app/build/outputs/mapping/release/mapping.txt
