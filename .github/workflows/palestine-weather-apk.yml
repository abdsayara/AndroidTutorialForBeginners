name: Palestine Weather APK

on:
  push:
    paths:
      - "PalestineWeather/**"
      - ".github/workflows/palestine-weather-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PalestineWeather
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: palestine-weather-debug-apk
          path: PalestineWeather/app/build/outputs/apk/debug/app-debug.apk
