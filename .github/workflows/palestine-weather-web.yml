name: Palestine Weather Web

on:
  push:
    paths:
      - "PalestineWeatherWeb/**"
      - ".github/workflows/palestine-weather-web.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PalestineWeatherWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
