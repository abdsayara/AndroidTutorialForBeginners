# One-command deployment on a single server (PRD §4): docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innovate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innovate}
      POSTGRES_DB: ${POSTGRES_DB:-innovatelink}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-innovate}"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
             mc mb --ignore-existing local/$${S3_BUCKET:-innovatelink}; mc anonymous set none local/$${S3_BUCKET:-innovatelink}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-innovatelink}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-innovate}:${POSTGRES_PASSWORD:-innovate}@db:5432/${POSTGRES_DB:-innovatelink}
      S3_ENDPOINT: http://minio:9000
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app: { condition: service_started }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-innovate}:${POSTGRES_PASSWORD:-innovate}@db:5432/${POSTGRES_DB:-innovatelink}
      S3_ENDPOINT: http://minio:9000
    command: ["npx", "tsx", "src/worker/index.ts"]

  # PRD §9: daily database backup, 30-day retention.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-innovate}
    volumes: [./backups:/backups]
    entrypoint: >
      sh -c 'while true; do
        f=/backups/innovatelink-$$(date +%F).sql.gz;
        pg_dump -h db -U ${POSTGRES_USER:-innovate} ${POSTGRES_DB:-innovatelink} | gzip > $$f && echo "backup $$f";
        find /backups -name "*.sql.gz" -mtime +30 -delete;
        sleep 86400; done'

volumes:
  pgdata:
  miniodata:
