  <script>
    (function () {
      const led = document.getElementById("led");
      const slider = document.getElementById("delay");
      const val = document.getElementById("delay-val");
      const runBtn = document.getElementById("run-btn");
      let running = true, timer = null;

      function tick() {
        led.classList.toggle("on");
        timer = setTimeout(tick, Number(slider.value));
      }
      function setBtn() { runBtn.dataset.i18n = running ? "e1.sim.stop" : "e1.sim.run"; runBtn.innerHTML = t(runBtn.dataset.i18n); }

      slider.addEventListener("input", () => (val.textContent = slider.value));
      runBtn.addEventListener("click", () => {
        running = !running;
        clearTimeout(timer);
        if (running) tick(); else led.classList.remove("on");
        setBtn();
      });
      tick();
    })();
  </script>
